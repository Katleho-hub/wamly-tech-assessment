<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storefront</title>

    <!-- Product images are resized by the wsrv.nl image proxy -->
    <link rel="preconnect" href="https://wsrv.nl" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins is self-hosted (src/fonts). Only the body weight is preloaded;
         the build points this at the same hashed file index.css uses, so it's
         fetched once. font-display: swap shows the fallback font until it
         arrives. Fonts need crossorigin even from the same origin. -->
    <link
      rel="preload"
      href="./src/fonts/poppins-v24-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Product data is fetched from fakestoreapi.com. crossorigin matches
         fetch()'s CORS mode, so the browser reuses this connection. -->
    <link
      rel="preload"
      href="https://fakestoreapi.com/products"
      as="fetch"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storefront</title>
    <!-- Product data is fetched from fakestoreapi.com. crossorigin matches
         fetch()'s CORS mode, so the browser reuses this connection. -->
    <link rel="preconnect" href="https://fakestoreapi.com" crossorigin />
    <!-- Product images are resized by the wsrv.nl image proxy -->
    <link rel="preconnect" href="https://wsrv.nl" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights in use (400, 600, 700). The stylesheet loads without
         blocking render: media="print" doesn't block, and onload switches it
         to all. Text shows in the fallback font until Poppins arrives. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
